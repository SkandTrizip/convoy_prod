name: Deploy Backend

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "Convoy_API.postman_collection.json"

  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Deploy key fingerprint:"
          ssh-add -l
          ssh -p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" "echo connected as \$(whoami) in \$(pwd)"

      - name: Sync backend files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude 'logs/' \
            --exclude '.pytest_cache/' \
            -e "ssh -p ${SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Install dependencies and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          if [ ! -d venv ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          if [ ! -f .env ]; then
            echo "ERROR: ${DEPLOY_PATH}/.env is missing on the server."
            echo "Create it once with DATABASE_URL, API keys, etc."
            exit 1
          fi

          sudo systemctl restart convoy-api
          sleep 5
          if ! sudo systemctl is-active --quiet convoy-api; then
            echo "convoy-api failed to start. Recent logs:"
            sudo systemctl status convoy-api --no-pager || true
            sudo journalctl -u convoy-api -n 40 --no-pager || true
            exit 1
          fi
          echo "Backend deployed and convoy-api is running."
          EOF

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "${SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" bash -s <<'EOF'
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:5050/api/health | grep -q 'ok'; then
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed. Recent service logs:"
          sudo journalctl -u convoy-api -n 30 --no-pager || true
          curl -v http://127.0.0.1:5050/api/health || true
          exit 1
          EOF
